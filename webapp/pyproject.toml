[project]
name = "sem-batch-classifier"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "numpy",
    "scipy",
    "scikit-image",
    "pandas",
    "tifffile",
    "imagecodecs",
    "matplotlib",
    "pillow",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
py-modules = ["common", "segment", "features", "categorise", "main"]
