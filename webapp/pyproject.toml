[project]
name = "sem-batch-classifier"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "numpy",
    "scipy",
    "scikit-image",
    "pandas",
    "tifffile",
    "imagecodecs",
    "matplotlib",
    "pillow",
    # DINOv2 embedding second opinion (CPU-only torch wheel keeps the
    # deploy image ~4 GB smaller than the default CUDA wheel)
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.14.1%2Bcpu-cp310-cp310-manylinux_2_28_x86_64.whl",
    "transformers",
    "safetensors",
]
